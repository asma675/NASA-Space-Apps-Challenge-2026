services:
  blindspot:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - path: .env
        required: false
    environment:
      BLINDSPOT_DB_PATH: /app/data/blindspot.sqlite3
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
